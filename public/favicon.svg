<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1E0A24" />
      <stop offset="70%" stop-color="#0B0612" />
      <stop offset="100%" stop-color="#040206" />
    </radialGradient>

    <!-- Neon Tube Outer Glow Gradient -->
    <linearGradient id="neonGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A8C" />
      <stop offset="50%" stop-color="#FF4DA6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Neon Tube Core Bright Gradient -->
    <linearGradient id="coreLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FFE4F3" />
      <stop offset="75%" stop-color="#FF66B8" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <!-- Inner Heart Soft Fill -->
    <radialGradient id="innerHeartFill" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FF4DA6" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Intense Gaussian Glow Filter for Neon Radiance -->
    <filter id="neonAura" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="broadBlur" />
      <feGaussianBlur stdDeviation="2.5" result="sharpBlur" />
      <feMerge>
        <feMergeNode in="broadBlur" />
        <feMergeNode in="sharpBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Fine Sparkle Glow -->
    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sleek Dark Rounded Icon Base -->
  <rect width="64" height="64" rx="18" fill="url(#bgGlow)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="17.25" fill="none" stroke="#FF4DA6" stroke-opacity="0.25" stroke-width="1.2" />

  <!-- Heart Base Path Definition:
       M 32, 21
       C 32, 16.5  26.5, 11  18.5, 11
       C 10.5, 11  6, 19  6, 28
       C 6, 39  18, 48.5  32, 57
       C 46, 48.5  58, 39  58, 28
       C 58, 19  53.5, 11  45.5, 11
       C 37.5, 11  32, 16.5  32, 21 Z
  -->

  <!-- Layer 1: Ambient Heart Inner Glow Fill -->
  <path
    d="M 32 21 C 32 16.5 26.5 11 18.5 11 C 10.5 11 6 19 6 28 C 6 39 18 48.5 32 57 C 46 48.5 58 39 58 28 C 58 19 53.5 11 45.5 11 C 37.5 11 32 16.5 32 21 Z"
    fill="url(#innerHeartFill)"
  />

  <!-- Layer 2: Radiant Neon Outer Aura Stroke -->
  <path
    d="M 32 21 C 32 16.5 26.5 11 18.5 11 C 10.5 11 6 19 6 28 C 6 39 18 48.5 32 57 C 46 48.5 58 39 58 28 C 58 19 53.5 11 45.5 11 C 37.5 11 32 16.5 32 21 Z"
    fill="none"
    stroke="url(#neonGlowGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neonAura)"
  />

  <!-- Layer 3: Vibrant Mid-tone Neon Pink Tube -->
  <path
    d="M 32 21 C 32 16.5 26.5 11 18.5 11 C 10.5 11 6 19 6 28 C 6 39 18 48.5 32 57 C 46 48.5 58 39 58 28 C 58 19 53.5 11 45.5 11 C 37.5 11 32 16.5 32 21 Z"
    fill="none"
    stroke="#FF2D9B"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Layer 4: Razor-Sharp Brilliant White/Hot-Pink Core Filament -->
  <path
    d="M 32 21 C 32 16.5 26.5 11 18.5 11 C 10.5 11 6 19 6 28 C 6 39 18 48.5 32 57 C 46 48.5 58 39 58 28 C 58 19 53.5 11 45.5 11 C 37.5 11 32 16.5 32 21 Z"
    fill="none"
    stroke="url(#coreLightGrad)"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Layer 5: Aesthetic 4-Point Neon Sparkle on Upper-Right Arc -->
  <g filter="url(#sparkleGlow)">
    <path
      d="M 49 9 L 50.2 13 L 54.2 14.2 L 50.2 15.4 L 49 19.4 L 47.8 15.4 L 43.8 14.2 L 47.8 13 Z"
      fill="#FFFFFF"
    />
    <circle cx="49" cy="14.2" r="1.2" fill="#FFE0F0" />
  </g>
</svg>